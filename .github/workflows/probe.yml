name: Probe providers

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to probe (blank = defaults)"
        required: false
        default: ""
  push:
    branches: [ main ]
    paths:
      - "scraper/probe.py"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe
        run: |
          mkdir -p probe
          python scraper/probe.py ${{ github.event.inputs.urls }} 2>&1 | tee probe/report.txt
      - name: Save report to the 'probe' branch
        run: |
          cp probe/report.txt /tmp/report.txt
          git config user.name "foodmeta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-tmp
          git rm -rf --quiet . || true
          cp /tmp/report.txt report.txt
          git add report.txt
          git commit -m "Probe report" --quiet
          git push -f origin HEAD:probe
