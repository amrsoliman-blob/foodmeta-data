name: Scrape meals (hourly)

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:       # "Run workflow" button for a manual refresh
  push:
    branches: [ main ]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Scrape Talabat
        run: python scraper/scrape.py

      - name: Publish updated data
        run: |
          git config user.name "foodmeta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meals.json data/meta.json data/deliveroo.json data/sample.json 2>/dev/null || git add data/meals.json data/meta.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update meals data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
